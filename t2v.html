<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T2V 评测 — 评估工作台</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="评估工作台">
</head>
<body data-page="t2v">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">VE</span><span>评估工作台</span></a>
      <nav class="nav">
        <a data-page="caption" href="index.html">Caption 标注</a>
        <a data-page="t2v" href="t2v.html">T2V 评测</a>
        <a data-page="world" href="world.html">世界模型评测</a>
        <a data-page="rag" href="rag.html">法律 RAG</a>
        <a data-page="method" href="method.html">评测方法</a>
        <a data-page="dims" href="dims.html">评测维度</a>
        <a data-page="data" href="data.html">数据</a>
        <a data-page="badcase" href="badcase.html">BadCase 归因</a>
      </nav>
      <div class="top-actions">

        <button class="icon-btn" data-export>导出</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="workbench">
      <aside class="col case-list">
        <div class="queue-head"><h3>评测案例</h3><span class="count">2</span></div>
        <div id="case-list"></div>
      </aside>

      <section class="col workspace">
        <div class="stage-head">
          <div>
            <div class="stage-title" id="case-title">—</div>
            <div class="stage-sub" id="case-prompt">—</div>
          </div>
          <span class="chip demo">T2V · 五维</span>
        </div>

        <div class="wb-modebar">
          <span class="mode-note" id="mode-note">两侧独立 Rubric → 整体 A/B 单选</span>
        </div>

        <div class="syncbar">
          <label class="toggle" id="blind-label"><input type="checkbox" id="blind-toggle"> 盲评（隐藏模型名）</label>
          <div class="pair-controls" id="pair-controls">
            <span class="pair-label">候选 1</span><select class="pair-select" id="pair-a" aria-label="候选 1"></select>
            <span class="pair-label">候选 2</span><select class="pair-select" id="pair-b" aria-label="候选 2"></select>
          </div>
          <span class="spacer"></span>
          <span class="hint">同 prompt、同时长、同分辨率；只评视觉</span>
        </div>

        <div class="t2v-grid" id="grid"></div>

        <div class="abbar" id="abbar">
          <button class="btn small" id="tp-play" type="button">▶ 播放</button>
          <button class="btn small" id="tp-back" type="button" title="后退 0.1 秒">−0.1s</button>
          <button class="btn small" id="tp-fwd" type="button" title="前进 0.1 秒">+0.1s</button>
          <button class="btn small" id="tp-home" type="button">回到开头</button>
          <span class="tread" id="tp-read">00:00.000 / 00:05.000</span>
          <select class="mini-select" id="tp-rate" aria-label="倍速">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>
        <div class="ab-timeline">
          <div class="ab-track" id="tp-track" aria-label="播放进度">
            <div class="ab-seg" id="tp-seg">—</div>
            <div class="ab-playhead" id="tp-playhead"></div>
          </div>
          <div class="ab-ruler" id="tp-ruler"></div>
        </div>
        <div class="ab-foot">
          <span class="ab-hint" id="tp-hint">共同区间 0–5.000 秒 · 到结尾同时停止</span>
          <span class="spacer"></span>
          <select class="mini-select" id="tp-audio" aria-label="音频">
            <option value="stereo" selected>双声道</option>
            <option value="a">只听 A</option>
            <option value="b">只听 B</option>
            <option value="mute">静音</option>
          </select>
          <select class="mini-select" id="tp-align" aria-label="对齐模式">
            <option value="common" selected>共同区间同步</option>
            <option value="full">各自全片检查</option>
          </select>
        </div>

        <div class="note" id="case-note" style="margin-top:14px;">
          <strong>本组结论（揭盲后生成）：</strong>
          <span id="case-conclusion">—</span>
        </div>
      </section>

      <aside class="col panel">
        <h3 id="model-title">按片段证据评分</h3>
        <div class="panel-sub" id="model-sub">1 明显不符，3 大体满足，5 完整稳定；未检查留空，低于 3 分需理由。</div>
        <div id="dims"></div>

        <div class="vote-box hidden" id="vote-box">
          <div class="vote-head"><strong>整体判断</strong><span>两侧都评完后投整体</span></div>
          <div class="vote-row">
            <button class="vote-btn" type="button" data-vote="G">A 更好</button>
            <button class="vote-btn" type="button" data-vote="S">持平</button>
            <button class="vote-btn" type="button" data-vote="B">B 更好</button>
          </div>
          <div class="vote-result" id="vote-result">两侧各 0/5 维</div>
          <div class="vote-deltas" id="vote-deltas"></div>
        </div>

        <div class="actions">
          <button class="btn" id="export-btn" type="button">导出 JSON</button>
          <button class="btn" id="save-btn" type="button">保存草稿</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="assets/dims-data.js"></script>
<script src="assets/tip.js"></script>
<script src="assets/app.js"></script>
  <script src="assets/ab-workbench.js"></script>
</body>
</html>
